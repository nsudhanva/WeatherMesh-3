name: build-and-push-image

# Builds the WeatherMesh-3 inference image on a native amd64 runner (no QEMU)
# and pushes to ECR. Manual trigger by default; flip on `push` once the OIDC
# role + AWS_GHA_ROLE_ARN secret are configured.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ['server/**', 'model_latlon/**', 'utils.py', 'meshes.py', 'model.py', 'pyproject.toml', 'uv.lock']

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: 194290773983.dkr.ecr.us-east-1.amazonaws.com/wm3-pipeline

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REPO }}:latest
            ${{ env.ECR_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container self-test (imports torch/natten/matepoint/model, builds meshes)
        run: docker run --rm ${{ env.ECR_REPO }}:${{ github.sha }} --selftest
